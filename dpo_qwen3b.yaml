# LLaMA-Factory DPO 训练配置 (从 SFT LoRA 继续)
# 用法: llamafactory-cli train dpo_qwen3b.yaml
# 注意: 8GB 卡用 simpo(免参考模型) + cutoff 704; sigmoid 需额外加载基座做 ref, 会 OOM。

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct   # 必须与 SFT adapter 的基座一致 (adapter_config.json 实测)
adapter_name_or_path: saves/Qwen2.5-3B-Instruct/lora/sft-cli   # 从 SFT 微调的 LoRA 继续

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
pref_loss: sigmoid              # 标准 DPO; LoRA 时 ref_model=None, 不额外加载参考模型, 每步多一次 reference 前传(no_grad)

### dataset
dataset: interview_preference_pairs
template: qwen
cutoff_len: 704                 # 实测 prompt+answer 最大 655 tokens; 704 已 100% 覆盖并留余量, 避免 896 的空 padding 撑爆 8GB 显存
preprocessing_num_workers: 4

### output
output_dir: saves/Qwen2.5-3B-Instruct/lora/dpo-cli-v2
logging_steps: 20
save_steps: 100
plot_loss: true

### train
per_device_train_batch_size: 1  # 8GB 卡保守; 先试跑确认显存, 有余再升
gradient_accumulation_steps: 8  # effective batch = 1×8 = 8
learning_rate: 1.0e-5           # DPO 学习率通常远小于 SFT (Qwen 建议 5e-7~1e-5)
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
optim: adamw_torch_fused        # 与第一次成功训练一致 (training_args.bin 实测 ADAMW_TORCH_FUSED)
ddp_timeout: 180000000

### eval
do_eval: false

### QLoRA
quantization_bit: 4
double_quantization: true
quantization_type: nf4
lora_rank: 8                    # 与 SFT adapter 一致 (rank 8 / alpha 16 / dropout 0)
lora_alpha: 16
lora_dropout: 0